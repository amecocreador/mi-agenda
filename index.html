/* ============================================================
   PIN LOCK SCREEN
   ============================================================ */
function LockScreen({ pin, onUnlock }) {
  const [val, setVal] = useState("");
  const [error, setError] = useState(false);
  const submit = () => { if (val === pin) onUnlock(); else { setError(true); setVal(""); setTimeout(() => setError(false), 900); } };
  return (
    <div style={{ position: "fixed", inset: 0, background: C.tealDark, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 18, zIndex: 100 }}>
      <style>{FONT_IMPORT}</style>
      <Lock size={30} color="#fff" style={{ opacity: .8 }} />
      <div style={{ fontFamily: "'Fraunces', serif", fontSize: 22, color: "#fff" }}>Introduce tu PIN</div>
      <input autoFocus type="password" inputMode="numeric" maxLength={4} value={val}
        onChange={(e) => setVal(e.target.value.replace(/\D/g, "").slice(0, 4))}
        onKeyDown={(e) => e.key === "Enter" && submit()}
        style={{ fontSize: 28, letterSpacing: 12, textAlign: "center", width: 160, padding: "10px 0", borderRadius: 12, border: "none", fontFamily: "'IBM Plex Mono', monospace" }} />
      {error && <div style={{ color: "#F3B4A6", fontSize: 13 }}>PIN incorrecto</div>}
      <Btn onClick={submit} disabled={val.length !== 4}>Entrar</Btn>
    </div>
  );
}

/* ============================================================
   NAV
   ============================================================ */
const NAV_ITEMS = [
  { id: "mi-dia", label: "Mi día", icon: Home },
  { id: "agenda", label: "Agenda", icon: CalendarDays },
  { id: "proyectos", label: "Proyectos", icon: FolderKanban },
  { id: "categorias", label: "Categorías", icon: Tag },
  { id: "dashboard", label: "Dashboard", icon: BarChart3 },
  { id: "buscar", label: "Buscar", icon: Search },
  { id: "ajustes", label: "Ajustes", icon: Settings },
];

/* ============================================================
   ROOT APP
   ============================================================ */
function App() {
  const [loaded, setLoaded] = useState(false);
  const [tasks, setTasks] = useState([]);
  const [projects, setProjects] = useState([]);
  const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
  const [pin, setPin] = useState("");
  const [greetingName, setGreetingName] = useState("");
  const [unlocked, setUnlocked] = useState(false);

  const [view, setView] = useState("mi-dia");
  const [sidebarCollapsed, setSidebarCollapsed] = useState(() => (typeof window !== "undefined" ? window.innerWidth <= 820 : false));
  const isMobile = useIsMobile();
  const [taskModal, setTaskModal] = useState(null); // {} new, {...} edit, null closed
  const [projectModal, setProjectModal] = useState(null);
  const [categoryModal, setCategoryModal] = useState(null);
  const [quickAdd, setQuickAdd] = useState("");
  const [notifStatus, setNotifStatus] = useState(() => (typeof Notification !== "undefined" ? Notification.permission : "unsupported"));
  const firedRemindersRef = useRef(new Set());

  const requestNotifPermission = async () => {
    if (typeof Notification === "undefined") { setNotifStatus("unsupported"); return; }
    try {
      const perm = await Notification.requestPermission();
      setNotifStatus(perm);
    } catch (e) { setNotifStatus("unsupported"); }
  };

  useEffect(() => {
    if (!loaded) return;
    const check = () => {
      const due = getUpcomingReminderTriggers(tasks).filter((x) => x.trigger <= Date.now());
      due.forEach(({ task, reminder }) => {
        const key = task.id + ":" + reminder.id;
        if (firedRemindersRef.current.has(key)) return;
        firedRemindersRef.current.add(key);
        if (typeof Notification !== "undefined" && Notification.permission === "granted") {
          try {
            new Notification("Recordatorio: " + task.title, {
              body: `${reminderLabel(reminder.minutes)}${task.location ? ` · ${task.location}` : ""}`,
              tag: key,
            });
          } catch (e) { /* entorno sin soporte de notificaciones */ }
        }
      });
    };
    check();
    const id = setInterval(check, 30000);
    return () => clearInterval(id);
  }, [tasks, loaded]);

  useEffect(() => {
    (async () => {
      const data = await loadData();
      if (data) {
        setTasks(data.tasks || []);
        setProjects(data.projects || []);
        setCategories(data.categories && data.categories.length ? data.categories : DEFAULT_CATEGORIES);
        setPin(data.pin || "");
        setGreetingName(data.greetingName || "");
        if (typeof data.sidebarCollapsed === "boolean") setSidebarCollapsed(data.sidebarCollapsed);
      }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    const t = setTimeout(() => saveData({ tasks, projects, categories, pin, greetingName, sidebarCollapsed }), 350);
    return () => clearTimeout(t);
  }, [tasks, projects, categories, pin, greetingName, sidebarCollapsed, loaded]);

  const saveTask = (t) => { setTasks((prev) => prev.some((x) => x.id === t.id) ? prev.map((x) => (x.id === t.id ? t : x)) : [...prev, t]); setTaskModal(null); };
  const deleteTask = (id) => { setTasks((prev) => prev.filter((x) => x.id !== id)); setTaskModal(null); };
  const quickStatus = (id, status) => setTasks((prev) => prev.map((t) => (t.id === id ? { ...t, status } : t)));

  const saveProject = (p) => { setProjects((prev) => prev.some((x) => x.id === p.id) ? prev.map((x) => (x.id === p.id ? p : x)) : [...prev, p]); setProjectModal(null); };
  const deleteProject = (id) => { setProjects((prev) => prev.filter((x) => x.id !== id)); setTasks((prev) => prev.map((t) => (t.projectId === id ? { ...t, projectId: "" } : t))); setProjectModal(null); };

  const saveCategory = (c) => { setCategories((prev) => prev.some((x) => x.id === c.id) ? prev.map((x) => (x.id === c.id ? c : x)) : [...prev, c]); setCategoryModal(null); };
  const deleteCategory = (id) => { setCategories((prev) => prev.filter((x) => x.id !== id)); setTasks((prev) => prev.map((t) => ({ ...t, categoryIds: (t.categoryIds || []).filter((x) => x !== id) }))); setCategoryModal(null); };

  const resetData = () => { if (window.confirm && !window.confirm) return; setTasks([]); setProjects([]); setCategories(DEFAULT_CATEGORIES); };

  const [quickAddToast, setQuickAddToast] = useState("");
  const handleQuickAdd = () => {
    try {
      if (!quickAdd.trim()) { setQuickAddToast("Escribe algo primero"); setTimeout(() => setQuickAddToast(""), 1600); return; }
      let parsed;
      try { parsed = parseQuickAdd(quickAdd); } catch (e) { parsed = { title: quickAdd, date: todayISO(), startTime: "" }; }
      const newTask = { ...emptyTask(), title: parsed.title, date: parsed.date, startTime: parsed.startTime };
      setTasks((prev) => [...prev, newTask]);
      setQuickAdd("");
      setQuickAddToast(`✓ Agregada: "${newTask.title}"`);
      setTimeout(() => setQuickAddToast(""), 2200);
    } catch (err) {
      setQuickAddToast("No se pudo agregar — inténtalo de nuevo");
      setTimeout(() => setQuickAddToast(""), 2200);
    }
  };

  if (!loaded) {
    return <div style={{ minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: C.bg, color: C.ink2, fontFamily: "Inter, sans-serif" }}>Cargando…</div>;
  }

  if (pin && !unlocked) return <LockScreen pin={pin} onUnlock={() => setUnlocked(true)} />;

  const viewProps = { tasks, categories, projects, onOpenTask: (t) => setTaskModal(t), onQuickStatus: quickStatus };

  return (
    <div style={{ minHeight: "100vh", background: C.bg, fontFamily: "Inter, sans-serif", color: C.ink, display: "flex", overflowX: "hidden" }}>
      <style>{FONT_IMPORT + `
        * { box-sizing: border-box; }
        ::selection { background: ${C.tealSoft}; }
        button, a { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid ${C.teal}; outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
      `}</style>

      {/* Sidebar / panel de navegación */}
      {isMobile && !sidebarCollapsed && (
        <div onClick={() => setSidebarCollapsed(true)} style={{ position: "fixed", inset: 0, background: "rgba(30,42,46,0.35)", zIndex: 19 }} />
      )}
      <div className="sidebar-nav" style={{
        width: sidebarCollapsed ? 68 : 220, borderRight: `1px solid ${C.line}`, padding: sidebarCollapsed ? "24px 10px" : "24px 16px",
        display: "flex", flexDirection: "column", gap: 4, flexShrink: 0, transition: "width .18s, padding .18s",
        ...(isMobile && !sidebarCollapsed
          ? { position: "fixed", top: 0, left: 0, bottom: 0, zIndex: 20, background: C.bg, boxShadow: "0 0 24px rgba(0,0,0,.18)" }
          : { position: "relative" }),
      }}>
        <button
          onClick={() => setSidebarCollapsed((v) => !v)}
          title={sidebarCollapsed ? "Expandir menú" : "Replegar menú"}
          style={{
            position: "absolute", top: 20, right: -12, width: 24, height: 24, borderRadius: 999,
            border: `1px solid ${C.line}`, background: "#fff", color: C.ink2, cursor: "pointer",
            display: "flex", alignItems: "center", justifyContent: "center", zIndex: 6, boxShadow: "0 1px 4px rgba(0,0,0,.08)",
          }}
        >
          {sidebarCollapsed ? <ChevronRight size={14} /> : <ChevronLeft size={14} />}
        </button>

        <div style={{ display: "flex", alignItems: "center", gap: 8, padding: sidebarCollapsed ? "0" : "0 8px", marginBottom: 22, justifyContent: sidebarCollapsed ? "center" : "flex-start" }}>
          <div style={{ width: 30, height: 30, borderRadius: 9, background: C.teal, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}><CalendarClock size={16} color="#fff" /></div>
          {!sidebarCollapsed && <span style={{ fontFamily: "'Fraunces', serif", fontSize: 18, fontWeight: 600, whiteSpace: "nowrap" }}>Mi Agenda</span>}
        </div>
        {NAV_ITEMS.map((it) => (
          <button key={it.id} onClick={() => { setView(it.id); if (isMobile) setSidebarCollapsed(true); }} title={sidebarCollapsed ? it.label : undefined} style={{
            display: "flex", alignItems: "center", gap: 10, padding: sidebarCollapsed ? "10px 0" : "10px 12px", borderRadius: 10, border: "none", cursor: "pointer",
            background: view === it.id ? C.tealSoft : "transparent", color: view === it.id ? C.tealDark : C.ink2, fontSize: 14, fontWeight: 600, textAlign: "left",
            justifyContent: sidebarCollapsed ? "center" : "flex-start",
          }}>
            <it.icon size={17} /> {!sidebarCollapsed && it.label}
          </button>
        ))}
        <div style={{ marginTop: "auto", paddingTop: 16 }}>
          <Btn onClick={() => { setTaskModal({}); if (isMobile) setSidebarCollapsed(true); }} title={sidebarCollapsed ? "Nueva tarea" : undefined} style={{ width: "100%", justifyContent: "center", padding: sidebarCollapsed ? "10px 0" : undefined }}>
            <Plus size={16} /> {!sidebarCollapsed && "Nueva tarea"}
          </Btn>
        </div>
      </div>

      <div style={{ flex: 1, minWidth: 0, display: "flex", flexDirection: "column" }}>
        <div className="quickadd-bar" style={{ padding: "20px 28px 0", background: C.bg }}>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <TextInput value={quickAdd} onChange={(e) => setQuickAdd(e.target.value)} onKeyDown={(e) => e.key === "Enter" && handleQuickAdd()}
              placeholder='Alta rápida — ej. "Reunión con Secretaría de Salud el martes a las 9am"' style={{ flex: "1 1 200px", minWidth: 0, fontSize: 16 }} />
            <Btn onClick={handleQuickAdd} style={{ flexShrink: 0 }}><Plus size={15} /> Agregar</Btn>
          </div>
          {quickAddToast && (
            <div style={{ marginTop: 8, fontSize: 13, fontWeight: 600, color: quickAddToast.startsWith("✓") ? C.baja : C.alta, display: "flex", alignItems: "center", gap: 6 }}>
              {quickAddToast}
            </div>
          )}
        </div>

        <div className="main-content" style={{ padding: "22px 28px 100px", flex: 1 }}>
          {view === "mi-dia" && <MiDia {...viewProps} greetingName={greetingName} />}
          {view === "agenda" && <Agenda {...viewProps} />}
          {view === "proyectos" && <Proyectos projects={projects} tasks={tasks} categories={categories} onOpenProject={(p) => setProjectModal(p)} onNewProject={() => setProjectModal({})} onOpenTask={(t) => setTaskModal(t)} onQuickStatus={quickStatus} />}
          {view === "categorias" && <Categorias categories={categories} tasks={tasks} onOpenCategory={(c) => setCategoryModal(c)} onNewCategory={() => setCategoryModal({})} />}
          {view === "dashboard" && <Dashboard tasks={tasks} projects={projects} />}
          {view === "buscar" && <Buscar {...viewProps} />}
          {view === "ajustes" && <Ajustes pin={pin} setPin={setPin} greetingName={greetingName} setGreetingName={setGreetingName} onResetData={resetData} notifStatus={notifStatus} onRequestNotif={requestNotifPermission} />}
        </div>
      </div>

      {/* Botón flotante de nueva tarea (solo móvil) */}
      <button onClick={() => setTaskModal({})} className="fab" style={{ display: "none" }} title="Nueva tarea" aria-label="Nueva tarea"><Plus size={22} color="#fff" /></button>

      <style>{`
        @media (max-width: 820px) {
          .main-content { padding: 16px 14px 90px !important; }
          .quickadd-bar { padding: 14px 14px 0 !important; }
          .modal-pad { padding: 14px 16px !important; }
          .fab { display: flex !important; position: fixed; bottom: 20px; right: 18px; width: 54px; height: 54px; border-radius: 999px; background: ${C.teal}; border: none; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(31,92,87,.35); cursor: pointer; z-index: 15; }
        }
        @media (max-width: 480px) {
          .main-content { padding: 14px 10px 90px !important; }
          .quickadd-bar { padding: 12px 10px 0 !important; }
          .modal-pad { padding: 12px 14px !important; }
        }
      `}</style>

      {taskModal !== null && <TaskModal task={taskModal} categories={categories} projects={projects} allTasks={tasks} onSave={saveTask} onDelete={deleteTask} onClose={() => setTaskModal(null)} />}
      {projectModal !== null && <ProjectModal project={projectModal} tasks={tasks} onSave={saveProject} onDelete={deleteProject} onClose={() => setProjectModal(null)} />}
      {categoryModal !== null && <CategoryModal category={categoryModal} onSave={saveCategory} onDelete={deleteCategory} onClose={() => setCategoryModal(null)} />}
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

  </script>
</body>
</html>
